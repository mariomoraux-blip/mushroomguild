<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>El Gremio de los Hongos</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" />
  </head>
  <body>
    <canvas id="ambient" class="ambient" aria-hidden="true"></canvas>
    <div class="app">
      <header id="hud" class="hud"></header>
      <main id="board-area" class="board-area">
        <div id="board" class="board">
          <div id="game" class="board__canvas"></div>
          <div id="overlay" class="board__overlay"></div>
        </div>
      </main>
      <section class="bottom">
        <div class="notice" id="notice-bar">
          <p id="notice" class="notice__text" aria-live="polite"></p>
          <button id="card-btn" class="btn notice__btn" type="button" hidden></button>
        </div>
        <nav id="dock" class="dock"></nav>
      </section>
    </div>
    <div id="sheet" class="sheet" hidden></div>
    <div id="story" class="story" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
